<!doctype html><html><head><meta charset="utf-8"/>
<title>Content Pipeline</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  body{font-family:system-ui;margin:24px;background:#0f1115;color:#e5e7eb}
  .drop{border:2px dashed #374151;border-radius:12px;padding:24px;text-align:center;background:#0b0d11}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{background:#f97316;border:0;border-radius:8px;padding:8px 12px;color:#1f1307;cursor:pointer}
  img{max-width:220px;border-radius:10px;border:1px solid #374151}
  pre{background:#0b0d11;border:1px solid #1f2937;border-radius:8px;padding:10px;overflow:auto}
</style></head><body>
<h1>Content Pipeline</h1><div>Static Web • :5510</div>
<div class="drop" id="drop">Drop image or click to choose <input id="file" type="file" accept="image/*" style="display:none"></div>
<div class="row"><button id="thumb">Make Thumbnail</button><button id="cdn">Simulate Upload</button></div>
<div class="row" id="preview"></div>
<pre id="out">Ready.</pre>
<script>
const out=document.getElementById('out'), file=document.getElementById('file'), drop=document.getElementById('drop'), preview=document.getElementById('preview');
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.style.opacity=.8}
drop.ondragleave=()=>drop.style.opacity=1
drop.ondrop=e=>{e.preventDefault();file.files=e.dataTransfer.files;handle()}
file.onchange=handle;
let blob=null;
function handle(){
  const f=file.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); blob=f;
  preview.innerHTML=`<img src="${url}"><div>name: ${f.name} • ${(f.size/1024).toFixed(1)}KB</div>`;
  out.textContent="Loaded locally. Ready to transform/upload.";
}
document.getElementById('thumb').onclick=async()=>{
  if(!blob) return alert("Pick a file first");
  const bmp=await createImageBitmap(blob);
  const c=document.createElement('canvas'); c.width=200; c.height=200;
  const ctx=c.getContext('2d'); ctx.drawImage(bmp,0,0,200,200);
  preview.innerHTML+=`<img src="${c.toDataURL()}">`;
  out.textContent="Generated thumbnail (client-side).";
};
document.getElementById('cdn').onclick=()=>{
  out.textContent="Pretend upload → https://cdn.example.com/..." ;
};
</script></body></html>
